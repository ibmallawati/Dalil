<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دليل — مساعد الخدمات الحكومية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- IBM Plex Sans Arabic: designed for Arabic UI text, not a Latin face
       with Arabic bolted on. Falls back to the system Arabic stack. -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="chat">
    <header class="chat__header">
      <div class="chat__brand">
        <h1>دليل</h1>
        <p>مساعد الخدمات الحكومية في سلطنة عُمان</p>
      </div>
      <!-- Which model answered. Small and quiet, but present: mid-demo it
           says whether we are on the primary model or already down the
           failover chain, and a judge seeing a fallback answer with no
           visible degradation is the resilience argument making itself. -->
      <div class="chat__meta">
        <span id="served-by" class="badge badge--idle" title="النموذج الذي أجاب"></span>
      </div>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div class="msg msg--bot">
        <div class="msg__text">
          مرحباً بك في دليل. اسألني عن إجراءات الخدمات الحكومية —
          مثل تجديد جواز السفر أو البطاقة الشخصية أو السجل التجاري.
        </div>
      </div>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <input
        id="input"
        class="composer__input"
        type="text"
        placeholder="اكتب سؤالك هنا..."
        aria-label="اكتب سؤالك"
      />
      <button id="send" class="composer__send" type="submit">إرسال</button>
    </form>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
